name: Deploy multiselect test site

on:
  push:
    branches:
      - feature/multiselect
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Create GitHub Pages test manifest
        run: |
          cp docs/hierarchynavigator-1.0.trex docs/hierarchynavigator-multiselect.trex
          sed -i 's#https://tableau.github.io/extension-hierarchy-navigator-sandboxed/hierarchynavigator.html#https://bschabli.github.io/extension-hierarchy-navigator-multiselect/hierarchynavigator.html#g' docs/hierarchynavigator-multiselect.trex

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
